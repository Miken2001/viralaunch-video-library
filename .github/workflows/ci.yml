name: library
on: [push, pull_request]
# Batch runs push one commit per new entry; only the newest push needs checking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Render previews of changed entries
        run: pnpm preview --all --changed
